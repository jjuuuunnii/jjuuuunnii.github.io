<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강승준 | Backend Engineer · Product Builder</title>
  <meta name="description" content="운영 중인 서비스의 백엔드를 책임지고, 두 번의 공동창업에서 제품을 검증한 강승준의 포트폴리오">
  <meta property="og:title" content="강승준 | Backend Engineer · Product Builder">

  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090b'/%3E%3Ctext x='16' y='22' font-size='17' font-family='monospace' font-weight='700' fill='%23e8b931' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260918d">
</head>
<body>
  <!-- Grain 텍스처 오버레이 -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- 네비게이션 -->
  <nav id="navbar">
    <div class="nav-container">
      <a href="#hero" class="nav-logo">강승준</a>
      <button class="nav-toggle" aria-label="메뉴 열기">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links">
        <li><a href="#experience">Experience</a></li>
        <li><a href="#ventures">Ventures</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Tech Stack</a></li>
        <li><a href="#activities">Activities</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <!-- 히어로 -->
    <section id="hero">
      <div class="hero-inner">
        <div class="hero-profile reveal">
          <div class="image-wrapper">
            <img src="" alt="프로필 사진" id="about-profile-img">
          </div>
        </div>
        <div class="hero-content">
          <p class="hero-label reveal" id="hero-label"></p>
          <h1 class="hero-name reveal"></h1>
          <p class="hero-tagline"></p>
          <p class="hero-description reveal" id="about-description"></p>
          <div class="hero-buttons reveal">
            <div class="hero-contacts" id="about-contacts"></div>
            <div class="hero-cta">
              <a href="#experience" class="btn btn-primary">경력 보기</a>
              <a href="#ventures" class="btn btn-outline">창업 기록</a>
            </div>
          </div>
        </div>
      </div>
      <div class="hero-scroll-indicator">
        <span>Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </section>

    <!-- 경력 -->
    <section id="experience">
      <div class="container">
        <div class="section-header reveal">
          <span class="section-number">01</span>
          <h2 class="section-title">Experience</h2>
          <div class="section-line"></div>
        </div>
        <div class="experience-header reveal" id="experience-header"></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- 창업 -->
    <section id="ventures">
      <div class="container">
        <div class="section-header reveal">
          <span class="section-number">02</span>
          <h2 class="section-title">Ventures</h2>
          <div class="section-line"></div>
        </div>
        <div id="ventures-content"></div>
      </div>
    </section>

    <!-- 프로젝트 -->
    <section id="projects">
      <div class="container">
        <div class="section-header reveal">
          <span class="section-number">03</span>
          <h2 class="section-title">Projects</h2>
          <div class="section-line"></div>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <!-- 스킬 -->
    <section id="skills">
      <div class="container">
        <div class="section-header reveal">
          <span class="section-number">04</span>
          <h2 class="section-title">Tech Stack</h2>
          <div class="section-line"></div>
        </div>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <!-- 활동/수상 -->
    <section id="activities">
      <div class="container">
        <div class="section-header reveal">
          <span class="section-number">05</span>
          <h2 class="section-title">Activities & Awards</h2>
          <div class="section-line"></div>
        </div>
        <div class="activities-grid" id="activities-content"></div>
      </div>
    </section>

  </main>

  <!-- 프로젝트 모달 -->
  <div class="modal-overlay" id="project-modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-container" role="dialog" aria-modal="true">
      <button class="modal-close" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="modal-image-area" id="modal-image-area"></div>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 강승준. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js?v=20260918d"></script>
  <script src="js/app.js?v=20260918d"></script>
